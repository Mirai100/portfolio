<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="grid-overlay"></div>
        <div class="tech-lines"></div>
        <div class="accent-shape-1"></div>
        <div class="accent-shape-2"></div>
    </div>

    <main class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-text">
                    <div class="tag">VTUBER / CREATOR</div>
                    <h1 class="name">NAME <span class="sub-title">// OFFICIAL</span></h1>
                    <p class="description">
                        ここにプロフィールテキストや紹介文が入ります。<br>
                        青・黒・白を基調としたスタイリッシュなデザイン。
                    </p>
                    <div class="status-badge">
                        <span class="status-dot"></span> ONLINE / CREATING
                    </div>
                </div>
                <div class="profile-image-wrapper">
                    <div class="image-frame">
                        <img src="profile-icon.jpg" alt="Profile Icon" class="profile-image">
                        <div class="corner-accents">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
